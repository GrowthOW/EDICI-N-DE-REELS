<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../scripts/piezas/brand.css">
<!-- Carrusel 4:5 con look nativo (Iván, 14 oct): foto real a sangre con texto en cajas blancas, o «post de texto» (avatar, Orbis Ways @orbisways, texto grande).
     Sin bloques azules, sin botón amarillo, sin lámina final con logo. Estado por location.hash (render.js still). -->
<style>
html,body{width:1080px;height:1350px;overflow:hidden;margin:0;background:#fff}
#s{position:relative;width:1080px;height:1350px;overflow:hidden}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;left:0;right:0;height:62%;pointer-events:none}
.shade.top{top:0;background:linear-gradient(to bottom,rgba(0,0,0,.38),rgba(0,0,0,0))}
.shade.bottom{bottom:0;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0))}
.txt{position:absolute;left:80px;right:80px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.txt.top{top:150px}.txt.bottom{bottom:120px}.txt.mid{top:50%;transform:translateY(-50%)}
.hd{font-family:Body,sans-serif;font-weight:700;font-size:76px;line-height:1.48;max-width:900px}
.hd span{background:#fff;color:#161616;padding:6px 24px 10px;border-radius:18px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.bd{font-family:Body,sans-serif;font-weight:700;font-size:42px;line-height:1.35;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.5);max-width:860px}
.stk{display:inline-block;background:#fff;color:#161616;font-family:Body,sans-serif;font-weight:700;font-size:36px;padding:10px 24px 13px;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.22);transform:rotate(-2.5deg)}
/* post de texto */
.post{position:absolute;left:96px;right:96px;top:50%;transform:translateY(-50%)}
.who{display:flex;align-items:center;gap:22px;margin-bottom:40px}
.av{width:96px;height:96px;border-radius:50%;background:#1376A4;color:#fff;font-family:Head,sans-serif;font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.nm{font-family:Body,sans-serif;font-weight:700;font-size:38px;color:#161616;line-height:1.2}
.hn{font-family:Body,sans-serif;font-weight:500;font-size:32px;color:#6b6b6b}
.ph1{font-family:Body,sans-serif;font-weight:700;font-size:84px;line-height:1.12;color:#161616;letter-spacing:-.01em;margin:0 0 34px}
.pb{font-family:Body,sans-serif;font-weight:500;font-size:46px;line-height:1.4;color:#2b2b2b}
.pb p{margin:0 0 22px}
.src{font-family:Body,sans-serif;font-weight:600;font-size:28px;color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.6)}
</style></head>
<body><div id="s"></div>
<script>
const s = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}');
const st = document.getElementById('s');
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.textContent = h; return e; };
if (s.type === 'photo') {
  const p = el('div', 'ph'); p.style.backgroundImage = `url(img/${s.img})`; if (s.bp) p.style.backgroundPosition = s.bp; st.appendChild(p);
  st.appendChild(el('div', 'shade ' + (s.pos === 'bottom' ? 'bottom' : 'top')));
  const t = el('div', 'txt ' + (s.pos || 'top'));
  const h = el('div', 'hd'); h.appendChild(el('span', '', s.head)); t.appendChild(h);
  if (s.body) t.appendChild(el('div', 'bd', s.body));
  if (s.sticker) t.appendChild(el('div', 'stk', '📍 ' + s.sticker));
  if (s.src) t.appendChild(el('div', 'src', s.src));
  st.appendChild(t);
} else {
  const p = el('div', 'post');
  const w = el('div', 'who'); w.appendChild(el('div', 'av', 'OW'));
  const n = el('div'); n.appendChild(el('div', 'nm', 'Orbis Ways')); n.appendChild(el('div', 'hn', '@orbisways')); w.appendChild(n);
  p.appendChild(w); p.appendChild(el('h1', 'ph1', s.head));
  const b = el('div', 'pb'); (s.body || []).forEach(x => b.appendChild(el('p', '', x))); p.appendChild(b);
  if (s.sticker) { const k = el('div', 'stk', '📍 ' + s.sticker); k.style.marginTop = '18px'; p.appendChild(k); }
  st.appendChild(p);
}
const imgs = [...document.querySelectorAll('.ph')].map(d => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = `img/${s.img}`; }));
Promise.all([document.fonts.ready, ...imgs]).then(() => { window.__READY__ = true; });
</script></body></html>
