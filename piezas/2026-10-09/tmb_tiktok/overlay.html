<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../scripts/piezas/brand.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;color:#fff}
.scrim{position:absolute;left:0;right:0;bottom:0;height:1150px;background:var(--scrim)}
.topscrim{position:absolute;left:0;right:0;top:0;height:900px;
  background:linear-gradient(to bottom,rgba(10,40,58,.55),rgba(10,40,58,0))}
/* titular: dentro de 72..880 px (zona segura derecha 200) */
.cap{position:absolute;left:72px;width:808px;font-family:Head;font-weight:900;line-height:1.08;
  letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.28)}
.cap.hook{top:300px;font-size:112px}
.cap.mid{bottom:740px;font-size:86px}
.sub{position:absolute;left:72px;width:808px;font-family:Body;font-weight:700;font-size:42px;line-height:1.25;
  text-shadow:0 2px 14px rgba(0,0,0,.3)}
.w{display:inline-block;opacity:0;will-change:transform}
.k{padding:0 .12em;margin:0 -.04em}
/* bloque inferior fijo del brandbook: país, chip con la ruta, 3 datos; acaba en y=1500 */
.block{position:absolute;left:72px;bottom:420px;display:flex;flex-direction:column;gap:18px}
.block .eyebrow{font-size:28px}
.block .chip{font-size:52px;padding:12px 30px 14px;border-radius:22px;align-self:flex-start}
.data{display:flex;gap:12px}
.d{background:rgba(10,40,58,.55);border-radius:14px;padding:10px 20px 12px;font-family:Head;font-weight:900;font-size:40px}
.d span{font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
</style></head>
<body><div id="stage">
  <div class="topscrim" id="topscrim"></div>
  <div class="scrim"></div>
  <div id="caps"></div>
  <div class="block">
    <div class="eyebrow">France · Italy · Switzerland</div>
    <div class="chip">Tour du Mont Blanc</div>
    <div class="data"><div class="d">158<span>km</span></div><div class="d">12<span>days</span></div><div class="d">10<span>stages</span></div></div>
  </div>
</div>
<script>
// tiempos en múltiplos de 0,04 s (25 fps)
const BEATS = [
  { t: 0.00, cls: 'hook', h: 'Tour du Mont Blanc *2027*', s: 'What to book, and when' },
  { t: 2.80, cls: 'mid',  h: 'Refuge bookings open *15 October*', s: 'on the official TMB website' },
  { t: 5.60, cls: 'mid',  h: 'Book the busiest stages *first*', s: 'then build your route around them' },
  { t: 8.40, cls: 'mid',  h: 'Rather sleep in *hotels*?', s: '' },
  { t: 11.20, cls: 'mid', h: 'We book every night *and carry your bags*', s: '' },
  { t: 14.00, cls: 'mid', h: 'Huts or hotels: *which would you pick?*', s: '' },
];
window.TOTAL = 16.80;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// cada palabra en su caja; las de *…* llevan la caja azul (palabras juntas, sin cortar la caja)
function words(str) {
  const out = []; let i = 0;
  str.replace(/\*(.+?)\*|([^*\s]+)/g, (m, k, w) => {
    // un signo suelto tras la palabra destacada («*hotels*?») va pegado a ella, sin espacio
    if (w && /^[?!.,:;]+$/.test(w) && out.length) { out[out.length - 1] = out[out.length - 1].replace(/<\/span>$/, esc(w) + '</span>'); return; }
    out.push(k ? `<span class="w"><span class="k">${esc(k).replace(/ /g, '&nbsp;')}</span></span>` : `<span class="w">${esc(w)}</span>`);
  });
  return out.join(' ');
}
const caps = document.getElementById('caps');
BEATS.forEach((b, i) => {
  const d = document.createElement('div'); d.id = 'b' + i; d.style.display = 'none';
  d.innerHTML = `<div class="cap ${b.cls}">${words(b.h)}</div>` + (b.s ? `<div class="sub">${words(b.s)}</div>` : '');
  caps.appendChild(d);
});
function layout() { // la entradilla va justo debajo del titular
  BEATS.forEach((b, i) => {
    const el = document.getElementById('b' + i), cap = el.querySelector('.cap'), sub = el.querySelector('.sub');
    el.style.display = 'block';
    if (sub) {
      const r = cap.getBoundingClientRect();
      if (b.cls === 'hook') sub.style.top = (r.bottom + 24) + 'px';
      else { cap.style.bottom = '800px'; sub.style.top = '1132px'; }
    }
    el.style.display = 'none';
  });
}
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
window.renderAt = t => {
  let cur = 0; BEATS.forEach((b, i) => { if (t >= b.t) cur = i; });
  BEATS.forEach((b, i) => { document.getElementById('b' + i).style.display = i === cur ? 'block' : 'none'; });
  document.getElementById('topscrim').style.opacity = cur === 0 ? 1 : 0;
  const b = BEATS[cur], el = document.getElementById('b' + cur), lt = t - b.t;
  // frame 0: el gancho entero ya visible (búsqueda legible desde el fotograma 0)
  [...el.querySelectorAll('.w')].forEach((w, j) => {
    const p = cur === 0 && lt === 0 ? 1 : ease((lt - j * 0.07) / 0.2);
    w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 28}px) scale(${0.96 + 0.04 * p})`;
  });
};
document.fonts.ready.then(() => { layout(); window.renderAt(0); window.__READY__ = true; });
</script></body></html>
