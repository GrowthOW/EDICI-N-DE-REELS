<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../scripts/piezas/brand.css">
<style>
html,body{width:1080px;height:1350px;overflow:hidden}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Body;color:var(--ink);background:var(--surface)}
.photo{position:absolute;inset:0;background-size:cover;background-position:center;filter:contrast(1.14) saturate(1.1) brightness(1.03)}
.photo.lift{filter:contrast(1.1) saturate(1.12) brightness(1.3)}
.scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,40,58,0) 30%,rgba(10,40,58,.82) 100%)}
.scrim-top{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,40,58,.75) 0%,rgba(10,40,58,0) 55%)}
.pad{position:absolute;left:80px;right:80px}
.eyebrow{font-size:26px;color:var(--brand)}
.on .eyebrow{color:#fff}
h1{font-family:Head;font-weight:900;font-size:96px;line-height:1.04;letter-spacing:-.01em;margin:18px 0 0}
h2{font-family:Head;font-weight:900;font-size:80px;line-height:1.06;letter-spacing:-.01em;margin:16px 0 0}
p{font-size:40px;line-height:1.35;margin:26px 0 0;font-weight:600}
.on{color:#fff}
.on .k{background:var(--brand)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
.box{border-radius:var(--radius-lg);padding:34px 36px;background:var(--surface-soft);border:2px solid var(--line)}
.box b{display:block;font-family:Head;font-weight:900;font-size:64px;color:var(--brand);line-height:1}
.box span{display:block;margin-top:12px;font-size:32px;font-weight:600}
.box.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.box.dark b{color:#fff}
.stat{font-family:Head;font-weight:900;font-size:220px;line-height:.95;color:var(--brand-light);letter-spacing:-.02em}
.src{position:absolute;left:80px;bottom:64px;font-size:24px;font-weight:600;opacity:.75}
.bar{margin-top:30px}
.bar .row{display:flex;justify-content:space-between;font-family:Head;font-weight:800;font-size:38px;margin-bottom:10px}
.bar .track{height:30px;border-radius:999px;background:var(--surface-soft);overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:var(--brand)}
.steps{margin-top:46px;display:flex;flex-direction:column;gap:22px}
.step{display:flex;gap:28px;align-items:center;border-radius:var(--radius-lg);padding:28px 32px;background:var(--surface-soft);border:2px solid var(--line)}
.step i{font-style:normal;flex:0 0 76px;height:76px;border-radius:50%;background:var(--brand);color:#fff;font-family:Head;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center}
.step div{font-size:36px;font-weight:700;line-height:1.25}
.swipe{position:absolute;right:80px;bottom:72px;font-family:Head;font-weight:800;font-size:30px;color:#fff;letter-spacing:.06em}
.num{position:absolute;right:80px;top:70px;font-family:Head;font-weight:800;font-size:24px;letter-spacing:.08em;color:var(--ink-muted)}
.on .num,.num.on{color:#fff;opacity:.85}
.cta{background:var(--brand);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 80px}
.cta img{width:440px}
.cta h2{font-size:84px;margin-top:56px}
.cta ul{list-style:none;padding:0;margin:34px 0 0;font-size:38px;font-weight:700;line-height:1.6}
.cta ul li::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--brand-light);margin-right:20px;vertical-align:middle;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.btn{align-self:flex-start;margin-top:52px;background:var(--accent);color:var(--ink);border-radius:999px;padding:22px 44px 24px;font-family:Head;font-weight:900;font-size:40px}
</style></head>
<body><div id="root"></div>
<script>
const P = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const k = s => esc(s).replace(/\*(.+?)\*([:?!.,]?)/g, (m, w, p) => `<span style="white-space:nowrap"><span class="k">${w.replace(/ /g, '&nbsp;')}</span>${p}</span>`);
const kl = s => esc(s).replace(/\*(.+?)\*/g, (m, w) => `<span class="kl">${w}</span>`);
const N = n => `<div class="num">${n} / 8</div>`;
const S = {
  s1: `<div class="s on"><div class="photo" style="background-image:url(img/obradoiro.jpg)"></div><div class="scrim"></div>
      <div class="pad" style="bottom:150px"><div class="eyebrow">Camino de Santiago</div>
      <h1>${k('Camino *Holy Year 2027*: what changes')}</h1>
      <p>Save this before you plan your Camino.</p></div><div class="swipe">SWIPE →</div></div>`,
  s2: `<div class="s">${N(2)}<div class="pad" style="top:50%;transform:translateY(-50%)"><div class="eyebrow">The basics</div>
      <h2>${kl('What is a *Holy Year*?')}</h2>
      <p>It happens when 25 July, St James's Day, falls on a Sunday.</p>
      <div class="mosaic"><div class="box dark"><b>2027</b><span>25 July is a Sunday</span></div>
      <div class="box"><b>2032</b><span>The next one</span></div></div></div></div>`,
  s3: `<div class="s on"><div class="photo lift" style="background-image:url(img/arcos.jpg)"></div><div class="scrim"></div>${'<div class="num on">3 / 8</div>'}
      <div class="pad" style="bottom:130px"><div class="eyebrow">Santiago Cathedral</div>
      <h2>${k('The Holy Door opens *31 Dec 2026*')}</h2>
      <p>At 17:00. It stays open all through 2027, the only year it does until 2032.</p></div></div>`,
  s4: `<div class="s on" style="background:var(--ink)">${'<div class="num on">4 / 8</div>'}<div class="pad" style="top:50%;transform:translateY(-55%)">
      <div class="eyebrow" style="color:var(--brand-light)">Pilgrims in 2025</div>
      <div class="stat" style="margin-top:30px">530,987</div>
      <h2 style="font-size:66px">reached Santiago. A record, and <span style="color:var(--brand-light)">not even a Holy Year</span>.</h2></div>
      <div class="src" style="color:#fff">Source: Pilgrim's Office, Santiago Cathedral (2025)</div></div>`,
  s5: `<div class="s">${N(5)}<div class="pad" style="top:50%;transform:translateY(-50%)"><div class="eyebrow">Where they walked in 2025</div>
      <h2>${kl('Three routes, *80%* of pilgrims')}</h2>
      ${[['Camino Francés', 45], ['Portuguese Way', 19], ['Portuguese Coastal Way', 16]].map(([n, v]) =>
        `<div class="bar"><div class="row"><span>${n}</span><span>${v}%</span></div><div class="track"><div class="fill" style="width:${v * 2}%"></div></div></div>`).join('')}
      <p style="font-size:34px">The rest spread across the Northern, Primitive, English and other ways.</p></div>
      <div class="src">Source: Pilgrim's Office, Santiago Cathedral (2025)</div></div>`,
  s6: `<div class="s on"><div class="photo" style="background-image:url(img/caminantes.jpg)"></div><div class="scrim"></div>${'<div class="num on">6 / 8</div>'}
      <div class="pad" style="bottom:130px"><div class="eyebrow">The classic</div>
      <h2>${k('Walk *the last 100 km*')}</h2>
      <p>It's the minimum for the Compostela. From Sarria: 114 km in 5 walking days.</p></div></div>`,
  s7: `<div class="s">${N(7)}<div class="pad" style="top:50%;transform:translateY(-50%)"><div class="eyebrow">Plan it calmly</div>
      <h2>${kl('Your Holy Year Camino in *3 steps*')}</h2>
      <div class="steps">
        <div class="step"><i>1</i><div>Pick your dates early. Summer is the busiest season.</div></div>
        <div class="step"><i>2</i><div>Choose your start: Sarria on the Francés, or Tui on the Portuguese Way.</div></div>
        <div class="step"><i>3</i><div>Send your bags ahead and walk with a day pack.</div></div>
      </div></div></div>`,
  s8: `<div class="s cta"><img src="../../../scripts/piezas/orbisways_logo_white.png" alt="">
      <h2>Your 2027 Camino, planned for you.</h2>
      <ul><li>Hotels booked</li><li>Bags carried</li><li>24/7 support</li></ul>
      <div class="btn">Plan yours · link in bio</div></div>`,
};
document.getElementById('root').innerHTML = S[P.id];
// aviso si un texto se sale de la lámina
document.fonts.ready.then(() => {
  const bad = [...document.querySelectorAll('h1,h2,p,.step,.bar,.btn')].filter(e => { const r = e.getBoundingClientRect(); return r.right > 1001 || r.bottom > 1290 || r.top < 60; });
  if (bad.length) window.__WARN__ = bad.map(e => e.tagName + ':' + e.textContent.slice(0, 30)).join(' | ');
  window.__READY__ = true;
});
</script></body></html>
