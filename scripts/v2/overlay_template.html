<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Manrope';font-weight:700;src:url('../orbisways_style/fonts/manrope-latin-700-normal.woff2') format('woff2');}
  @font-face{font-family:'Manrope';font-weight:800;src:url('../orbisways_style/fonts/manrope-latin-800-normal.woff2') format('woff2');}
  @font-face{font-family:'OrbisBody';font-weight:700;src:url('../orbisways_style/fonts/LiberationSans-Bold.ttf') format('truetype');}
  html,body{margin:0;padding:0;background:transparent;}
  #stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:transparent;}
  .seg{position:absolute;inset:0;display:none;}
  .gradient{position:absolute;left:0;right:0;bottom:0;height:1250px;
    background:linear-gradient(to bottom, rgba(6,20,30,0) 0%, rgba(6,20,30,0.5) 40%, rgba(6,20,30,0.84) 100%);}
  /* bottom-anchored so the block grows upward and stays clear of the IG caption/UI zone */
  .info{position:absolute;left:80px;right:70px;bottom:330px;display:flex;flex-direction:column;align-items:flex-start;}
  .info .country, .info .badges, .info .pill, .info .headline{position:relative;left:auto;top:auto;right:auto;}
  .info .country{margin-bottom:20px;}
  .info .badges{margin-bottom:34px;}
  .info .pill{margin-bottom:24px;}
  .top-gradient{position:absolute;left:0;right:0;top:0;height:420px;
    background:linear-gradient(to bottom, rgba(4,14,22,0.55) 0%, rgba(4,14,22,0) 100%);}

  .country{position:absolute;left:80px;top:126px;font-family:'Manrope',sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:0.14em;color:#FFFFFF;font-size:32px;
    text-shadow:0 2px 10px rgba(0,0,0,0.35);transform-origin:0% 50%;}

  .badges{position:absolute;left:80px;top:200px;display:flex;gap:22px;}
  .badge{background:rgba(10,30,45,0.5);border-radius:18px;padding:20px 24px;min-width:140px;
    transform-origin:0% 100%;}
  .badge .val{font-family:'Manrope',sans-serif;font-weight:800;color:#FFFFFF;font-size:50px;line-height:1.05;display:block;white-space:nowrap;}
  .badge .cap{font-family:'Manrope',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;
    color:#F0D723;font-size:21px;display:block;margin-top:4px;}

  .pill{position:absolute;left:80px;top:1180px;display:inline-block;background:#1474A4;border-radius:16px;
    padding:22px 36px 18px;line-height:1.1;transform-origin:0% 100%;box-shadow:0 8px 24px rgba(0,0,0,0.25);}
  .pill span{font-family:'Manrope',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    color:#FFFFFF;font-size:66px;white-space:nowrap;}

  .headline{position:absolute;left:80px;top:1350px;right:70px;}
  .hline{font-family:'OrbisBody',Arial,sans-serif;font-weight:700;-webkit-text-stroke:3px #FFFFFF;paint-order:stroke fill;color:#FFFFFF;font-size:60px;line-height:1.12;
    margin:0;text-shadow:0 4px 18px rgba(0,0,0,0.35);transform-origin:0% 100%;}

  .headline.intro{top:1300px;}
  .headline.intro .hline{font-size:66px;}
  .pill.intro{top:1210px;padding:16px 28px;border-radius:11px;box-shadow:none;}
  .pill.intro span{font-size:34px;letter-spacing:0.05em;}

  .veil{position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 48%, rgba(10,42,62,0.70) 0%, rgba(4,14,22,0.92) 100%);}
  .outro-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:0 80px 60px;}
  .outro-wrap > *{transform-origin:50% 50%;}
  .o-logo{width:640px;height:auto;margin-bottom:46px;}
  .o-label{font-family:'Manrope',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.16em;
    color:#F0D723;font-size:30px;margin-bottom:26px;}
  .o-hline{font-family:'OrbisBody',Arial,sans-serif;font-weight:700;-webkit-text-stroke:3px #FFFFFF;paint-order:stroke fill;color:#FFFFFF;font-size:58px;line-height:1.05;margin:0;}
  .o-cta{margin-top:48px;display:inline-block;background:#1474A4;border-radius:16px;padding:24px 44px 20px;
    line-height:1.1;box-shadow:0 10px 30px rgba(0,0,0,0.35);}
  .o-cta span{font-family:'Manrope',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
    color:#FFFFFF;font-size:64px;white-space:nowrap;}
  .o-caption{margin-top:24px;font-family:'Manrope',sans-serif;font-weight:800;text-transform:uppercase;
    letter-spacing:0.12em;color:rgba(255,255,255,0.85);font-size:26px;}
</style>
</head>
<body>
<div id="stage">
  <div id="segs"></div>
</div>
<script id="timeline-data" type="application/json">__TIMELINE_JSON__</script>
<script id="content-data" type="application/json">__CONTENT_JSON__</script>
<script>
const TIMELINE = JSON.parse(document.getElementById('timeline-data').textContent);
const CONTENT = JSON.parse(document.getElementById('content-data').textContent);

const REVEAL = {
  intro: {
    pill: { off: 0.25, dur: 0.55 },
    h1:   { off: 0.55, dur: 0.60 },
    h2:   { off: 0.80, dur: 0.60 },
  },
  outro: {
    veil:    { off: 0.00, dur: 0.80 },
    logo:    { off: 0.35, dur: 0.60 },
    label:   { off: 0.40, dur: 0.55 },
    h1:      { off: 0.55, dur: 0.60 },
    h2:      { off: 0.72, dur: 0.60 },
    cta:     { off: 0.95, dur: 0.60 },
    caption: { off: 1.20, dur: 0.55 },
  },
  dest: {
    country: { off: 0.45, dur: 0.50 },
    badge1:  { off: 0.60, dur: 0.50 },
    badge2:  { off: 0.70, dur: 0.50 },
    badge3:  { off: 0.80, dur: 0.50 },
    pill:    { off: 1.00, dur: 0.55 },
    h1:      { off: 1.25, dur: 0.60 },
    h2:      { off: 1.45, dur: 0.60 },
    h3:      { off: 1.65, dur: 0.60 },
  }
};

function easeOutCubic(x){ x=Math.max(0,Math.min(1,x)); return 1-Math.pow(1-x,3); }
function easeOutBack(x){ x=Math.max(0,Math.min(1,x)); const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function lerp(a,b,t){ return a+(b-a)*t; }

const segsRoot = document.getElementById('segs');
const segEls = {};

TIMELINE.timeline.forEach(tl => {
  const key = tl.key;
  const data = CONTENT[key];
  const div = document.createElement('div');
  div.className = 'seg';
  div.dataset.key = key;

  const grad = document.createElement('div');
  grad.className = 'gradient';
  div.appendChild(grad);
  const topGrad = document.createElement('div');
  topGrad.className = 'top-gradient';
  div.appendChild(topGrad);

  const overlays = {};

  const add = (tag, cls, html, id, type, parent) => {
    const el = document.createElement(tag);
    el.className = cls;
    if (html !== null) el.innerHTML = html;
    (parent || div).appendChild(el);
    overlays[id] = { el, type };
    return el;
  };

  if (key === 'outro') {
    grad.remove(); topGrad.remove();
    add('div', 'veil', null, 'veil', 'veil');
    const wrap = document.createElement('div');
    wrap.className = 'outro-wrap';
    div.appendChild(wrap);
    if (data.logo) {
      const img = add('img', 'o-logo', null, 'logo', 'logo', wrap);
      img.src = '../../' + data.logo;
    }
    if (data.label) add('div', 'o-label', data.label, 'label', 'country', wrap);
    data.headline.forEach((line, idx) => add('p', 'o-hline', line, 'h' + (idx+1), 'headline', wrap));
    add('div', 'o-cta', `<span>${data.cta}</span>`, 'cta', 'pill', wrap);
    add('div', 'o-caption', data.cta_caption, 'caption', 'country', wrap);
  } else if (key === 'intro') {
    const pill = document.createElement('div');
    pill.className = 'pill intro';
    pill.innerHTML = `<span>${data.pill}</span>`;
    div.appendChild(pill);
    overlays['pill'] = { el: pill, type: 'pill' };

    const headline = document.createElement('div');
    headline.className = 'headline intro';
    data.headline.forEach((line, idx) => {
      const p = document.createElement('p');
      p.className = 'hline';
      p.textContent = line;
      headline.appendChild(p);
      overlays['h' + (idx+1)] = { el: p, type: 'headline' };
    });
    div.appendChild(headline);
  } else {
    topGrad.remove();
    const info = document.createElement('div');
    info.className = 'info';
    div.appendChild(info);

    add('div', 'country', null, 'country', 'country', info).textContent = data.country;

    const badges = document.createElement('div');
    badges.className = 'badges';
    info.appendChild(badges);
    data.badges.forEach((b, idx) => {
      const bd = add('div', 'badge', `<span class="val">${b.value}</span><span class="cap">${b.cap}</span>`,
                     'badge' + (idx+1), 'badge', badges);
      if (b.value.length > 9) bd.querySelector('.val').style.fontSize = '40px';
    });

    add('div', 'pill', `<span>${data.pill}</span>`, 'pill', 'pill', info);

    const headline = document.createElement('div');
    headline.className = 'headline';
    info.appendChild(headline);
    data.headline.forEach((line, idx) => add('p', 'hline', null, 'h' + (idx+1), 'headline', headline).textContent = line);
  }

  segsRoot.appendChild(div);
  segEls[key] = { container: div, gradient: grad, topGradient: topGrad, overlays };
});

function renderAtTime(t){
  TIMELINE.timeline.forEach(tl => {
    const rec = segEls[tl.key];
    if (t < tl.mountStart - 0.0005 || t > tl.mountEnd + 0.0005){
      rec.container.style.display = 'none';
      return;
    }
    rec.container.style.display = 'block';

    let opacity = 1;
    if (t < tl.fullStart){
      const p = clamp01((t - tl.mountStart) / (tl.fullStart - tl.mountStart || 1));
      opacity = easeOutCubic(p);
    } else if (t > tl.fullEnd){
      const p = clamp01((t - tl.fullEnd) / (tl.mountEnd - tl.fullEnd || 1));
      opacity = 1 - easeOutCubic(p);
    }
    rec.container.style.opacity = opacity;

    const revealBase = tl.mountStart;
    const revealSet = REVEAL[tl.key] || REVEAL.dest;
    for (const id in rec.overlays){
      const ov = rec.overlays[id];
      const cfg = revealSet[id];
      if (!cfg) continue;
      const start = revealBase + cfg.off;
      const p = clamp01((t - start) / cfg.dur);
      const eOpacity = easeOutCubic(p);
      if (ov.type === 'veil'){ ov.el.style.opacity = eOpacity; continue; }
      const isPop = (ov.type === 'badge' || ov.type === 'pill' || ov.type === 'logo');
      const eShape = isPop ? easeOutBack(p) : easeOutCubic(p);
      const scaleFrom = isPop ? 0.86 : 1.0;
      const scaleVal = isPop ? lerp(scaleFrom, 1, eShape) : 1;
      const tyFrom = (ov.type === 'headline') ? 30 : (isPop ? 16 : 10);
      const ty = lerp(tyFrom, 0, easeOutCubic(p));
      const blurVal = lerp(9, 0, easeOutCubic(p));
      ov.el.style.opacity = clamp01(eOpacity);
      ov.el.style.transform = `translateY(${ty}px) scale(${scaleVal})`;
      ov.el.style.filter = `blur(${blurVal}px)`;
    }
  });
}

window.renderAtTime = renderAtTime;
window.TOTAL_DURATION = TIMELINE.total_duration;
Promise.all([
  ...['700','800'].map(w => document.fonts.load(`${w} 40px Manrope`)),
  document.fonts.load('700 40px OrbisBody'),
  ...Array.from(document.images).map(img => img.decode()),
])
  .then(() => document.fonts.ready)
  .then(() => { window.__READY__ = true; });
renderAtTime(0);
</script>
</body>
</html>
