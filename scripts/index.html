<script>
const CONFIG = JSON.parse(document.getElementById('config-data').textContent);
const ASSET_BASE = "assets/";

const TRANS = 0.7;
const HOLDS = { portada: 2.8, montblanc: 3.0, whw: 3.0, fisherman: 3.0, cotswold: 3.2 };
const KB_MAX = { portada: 1.075, montblanc: 1.08, whw: 1.08, fisherman: 1.08, cotswold: 1.075 };
const KB_PAN_DIR = { portada: 1, montblanc: -1, whw: 1, fisherman: -1, cotswold: 1 };
const FINAL_FADE = 0.6;

const REVEAL = {
  portada: {
    pill: { off: 0.25, dur: 0.55 },
    h1:   { off: 0.55, dur: 0.60 },
    h2:   { off: 0.80, dur: 0.60 },
    h3:   { off: 1.05, dur: 0.60 },
  },
  dest: {
    country: { off: 0.55, dur: 0.50 },
    badge1:  { off: 0.75, dur: 0.50 },
    badge2:  { off: 0.87, dur: 0.50 },
    badge3:  { off: 0.99, dur: 0.50 },
    pill:    { off: 1.25, dur: 0.55 },
    h1:      { off: 1.55, dur: 0.60 },
    h2:      { off: 1.80, dur: 0.60 },
    h3:      { off: 2.05, dur: 0.60 },
  }
};

function easeOutCubic(x){ x = Math.max(0,Math.min(1,x)); return 1-Math.pow(1-x,3); }
function easeOutBack(x){
  x = Math.max(0,Math.min(1,x));
  const c1=1.70158, c3=c1+1;
  return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2);
}
function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function lerp(a,b,t){ return a + (b-a)*t; }

// build timeline
const order = CONFIG.slides.map(s => s.key);
const timeline = [];
let cursor = 0;
for (let i=0;i<order.length;i++){
  const key = order[i];
  const hold = HOLDS[key];
  const mountStart = (i===0) ? 0 : timeline[i-1].fullEnd;
  const fullStart = (i===0) ? 0 : mountStart + TRANS;
  const fullEnd = fullStart + hold;
  timeline.push({ key, mountStart, fullStart, fullEnd, mountEnd: null });
}
for (let i=0;i<timeline.length;i++){
  timeline[i].mountEnd = (i===timeline.length-1) ? timeline[i].fullEnd : timeline[i].fullEnd + TRANS;
}
const TOTAL_DURATION = timeline[timeline.length-1].mountEnd + FINAL_FADE;

// DOM build
const slidesRoot = document.getElementById('slides');
const slideEls = {};
CONFIG.slides.forEach(s => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.dataset.key = s.key;
  const img = document.createElement('img');
  img.className = 'bg';
  img.src = ASSET_BASE + s.bg;
  div.appendChild(img);
  const overlayEls = {};
  s.regions.forEach(r => {
    const o = document.createElement('div');
    o.className = 'overlay';
    o.style.left = r.x + 'px';
    o.style.top = r.y + 'px';
    o.style.width = r.w + 'px';
    o.style.height = r.h + 'px';
    const oi = document.createElement('img');
    oi.src = ASSET_BASE + r.file;
    o.appendChild(oi);
    div.appendChild(o);
    overlayEls[r.id] = { el: o, type: r.type };
  });
  slidesRoot.appendChild(div);
  slideEls[s.key] = { container: div, bgImg: img, overlays: overlayEls };
});

function renderAtTime(t){
  for (let i=0;i<timeline.length;i++){
    const tl = timeline[i];
    const rec = slideEls[tl.key];
    if (t < tl.mountStart - 0.0005 || t > tl.mountEnd + 0.0005){
      rec.container.style.display = 'none';
      continue;
    }
    rec.container.style.display = 'block';

    let opacity = 1, scaleExtra = 0, translateY = 0;
    if (i > 0 && t < tl.fullStart){
      const p = clamp01((t - tl.mountStart) / TRANS);
      const e = easeOutCubic(p);
      opacity = e;
      scaleExtra = lerp(0.06, 0, e);
      translateY = lerp(18, 0, e);
    } else if (i < timeline.length - 1 && t > tl.fullEnd){
      const p = clamp01((t - tl.fullEnd) / TRANS);
      const e = easeOutCubic(p);
      opacity = 1 - e;
      scaleExtra = lerp(0, 0.05, e);
      translateY = lerp(0, -14, e);
    }

    const kbp = clamp01((t - tl.mountStart) / (tl.mountEnd - tl.mountStart));
    const kbScale = lerp(1.0, KB_MAX[tl.key], kbp);
    const panX = KB_PAN_DIR[tl.key] * lerp(0, 16, kbp);
    const totalScale = kbScale + scaleExtra;

    rec.container.style.opacity = opacity;
    rec.container.style.transform = `translate(${panX}px, ${translateY}px) scale(${totalScale})`;

    const revealBase = tl.mountStart;
    const revealSet = (tl.key === 'portada') ? REVEAL.portada : REVEAL.dest;
    for (const id in rec.overlays){
      const ov = rec.overlays[id];
      const cfg = revealSet[id];
      if (!cfg) continue;
      const start = revealBase + cfg.off;
      const p = clamp01((t - start) / cfg.dur);
      const eOpacity = easeOutCubic(p);
      const isPop = (ov.type === 'badge' || ov.type === 'pill');
      const eShape = isPop ? easeOutBack(p) : easeOutCubic(p);
      const scaleFrom = isPop ? 0.86 : 1.0;
      const scaleVal = isPop ? lerp(scaleFrom, 1, eShape) : 1;
      const tyFrom = (ov.type === 'headline') ? 28 : (isPop ? 16 : 10);
      const ty = lerp(tyFrom, 0, easeOutCubic(p));
      const blurVal = lerp(10, 0, easeOutCubic(p));
      ov.el.style.opacity = clamp01(eOpacity);
      ov.el.style.transform = `translateY(${ty}px) scale(${scaleVal})`;
      ov.el.style.filter = `blur(${blurVal}px)`;
    }
  }

  const blackout = document.getElementById('blackout');
  const lastMountEnd = timeline[timeline.length-1].mountEnd;
  if (t >= lastMountEnd){
    const p = clamp01((t - lastMountEnd) / FINAL_FADE);
    blackout.style.opacity = easeOutCubic(p);
  } else {
    blackout.style.opacity = 0;
  }
}

window.renderAtTime = renderAtTime;
window.TOTAL_DURATION = TOTAL_DURATION;
window.__READY__ = true;
renderAtTime(0);
</script>
</body>
</html>
